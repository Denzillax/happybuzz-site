<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img"><title>Biene</title><style>.fl,.fr,.au,.al,.ar{transform-box:fill-box}.fl{transform-origin:100% 50%;animation:f .18s ease-in-out infinite alternate}.fr{transform-origin:0% 50%;animation:f .18s ease-in-out infinite alternate}@keyframes f{from{transform:scaleX(1)}to{transform:scaleX(.8)}}.au{transform-origin:50% 50%;animation:b 3.8s infinite}@keyframes b{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}.al{transform-origin:100% 100%;animation:w 1.3s ease-in-out infinite alternate}.ar{transform-origin:0% 100%;animation:w 1.3s ease-in-out infinite alternate-reverse}@keyframes w{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}.s1,.s2,.s3{animation:s 1.2s steps(1) infinite}.s2{animation-delay:.2s}.s3{animation-delay:.4s}@keyframes s{0%,60%{opacity:1}61%,100%{opacity:.15}}@media (prefers-reduced-motion:reduce){.fl,.fr,.au,.al,.ar,.s1,.s2,.s3{animation:none}}</style><g transform="translate(0 0)"><circle class="fl" cx="40" cy="104" r="38" fill="#191615"/><circle class="fr" cx="200" cy="104" r="38" fill="#191615"/><g class="al"><path d="M106 40 Q100 22 84 16" fill="none" stroke="#191615" stroke-width="6" stroke-linecap="round"/><circle cx="80" cy="13" r="10" fill="#191615"/></g><g class="ar"><path d="M134 40 Q140 22 156 16" fill="none" stroke="#191615" stroke-width="6" stroke-linecap="round"/><circle cx="160" cy="13" r="10" fill="#191615"/></g><path d="M103 166 L137 166 Q129 190 120 195 Q111 190 103 166Z" fill="#191615"/><rect x="69" y="32" width="102" height="84" rx="34" fill="#191615"/><rect x="63" y="94" width="114" height="80" rx="26" fill="#191615"/><circle class="au" cx="97" cy="66" r="10.5" fill="#F4C03F"/><circle class="au" cx="143" cy="66" r="10.5" fill="#F4C03F"/><circle cx="120" cy="83" r="6.5" fill="#F4C03F"/><rect x="72" y="103" width="96" height="19" rx="7" fill="#F4C03F"/><rect x="72" y="131" width="96" height="19" rx="7" fill="#F4C03F"/></g></svg>
